spring.application.name=ms-anomaly-detector

# DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/ms-anomaly-detector
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka Topics
kafka.topic.user-activity-events=user-activity-events

# Kafka Consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=anomaly-detector-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.model.event.UserEventMessage

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Anomaly detection thresholds
anomaly.brute-force.max-attempts=5
anomaly.brute-force.window-minutes=10
anomaly.suspicious-ip.max-users=3
anomaly.suspicious-ip.window-minutes=60
anomaly.impossible-travel.window-minutes=60
anomaly.new-device.failed-login-window-hours=24
anomaly.unusual-login-frequency.window-days=30
anomaly.unusual-login-frequency.multiplier=3.0
anomaly.unusual-login-frequency.min-history-logins=5

server.port=8081